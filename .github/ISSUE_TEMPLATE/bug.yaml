name: Bug Report  
description: Create a bug report  
labels:
  - 'kind: bug'

body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to fill out this bug report!

        Make sure you give it a short and specific **title** so that the report
        is searchable and uniquely identifiable.

        Note that this form is for **bug reports only**.

        **Helpful links before you proceed:**  
        - [GitHub repository](https://github.com/nlohmann/json)  
        - [API Reference / Documentation](https://nlohmann.github.io/json/api/json/)  
        - [FAQ](https://json.nlohmann.me/home/faq/) — check this first!  
        - [Exception Types](https://nlohmann.github.io/json/home/exceptions/)  
        - [Contribution Guidelines](https://json.nlohmann.me/community/contribution_guidelines/)  
        - [GitHub Discussions](https://github.com/nlohmann/json/discussions)  
        - [StackOverflow: nlohmann-json tag](https://stackoverflow.com/questions/tagged/nlohmann-json)  
        - [Blog / Tutorial: Extending nlohmann::json](https://www.kdab.com/jsonify-with-nlohmann-json/)

        For questions, feature requests, or support, please  
        [open a discussion](https://github.com/nlohmann/json/discussions/new).

  - type: textarea
    id: summary
    attributes:
      label: Description
      description: >
        Provide a clear and concise description of the issue and explain why
        you consider it a bug. Include any relevant documentation links,
        JSON specifications, or references.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: >
        Describe how to reproduce the issue step by step. Be as specific and
        detailed as possible.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Expected vs Actual results
      description: >
        Explain what you expected to happen and what actually occurred.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Code Example
      description: >
        If possible, provide a small self-contained code snippet that triggers
        the bug. Avoid including large code bases.
      render: shell

  - type: textarea
    id: output
    attributes:
      label: Error Messages / Output
      description: >
        Provide any compilation errors, exception messages, stack traces,
        or other output that helps diagnose the issue.
      render: shell

  - type: input
    id: compiler
    attributes:
      label: Compiler & Operating System
      description: >
        Specify the OS and compiler where you observed the issue. Include
        versions and any other relevant environment details.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library Version
      description: >
        Which version of the library are you using? Provide a release version (e.g. `3.12.0`) or a commit hash if you're on a dev build.
    validations:
      required: true

  - type: checkboxes
    id: validation
    attributes:
      label: Validation Checklist
      description: >
        Please confirm the following:
      options:
        - label: The bug also occurs when using the latest version from the [`develop`](https://github.com/nlohmann/json/tree/develop) branch.
        - label: I can successfully compile and run the unit tests.
