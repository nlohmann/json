version: 1

labels:
- label: "documentation"
  files:
    - "README.md"

- label: "documentation"
  files:
    - "docs/.*"

- label: "tests"
  files:
    - "tests/.*"

- label: "CMake"
  files:
    - ".*CMakeLists.txt"

- label: "CMake"
  files:
    - "cmake/.*"

- label: "CI"
  files:
    - ".github/workflows/.*"

- label: "CI"
  files:
    - ".github/external_ci/.*"

- label: "CI"
  files:
    - ".github/(dependabot|labeler)\\.yml"

- label: "aspect: binary formats"
  files:
    - "include/nlohmann/detail/input/binary_reader\\.hpp"
    - "include/nlohmann/detail/output/binary_writer\\.hpp"
    - "tests/src/unit-(bson|cbor|msgpack|ubjson|bjdata|bon8|binary_formats)"
    - "tests/src/fuzzer-parse_(bson|cbor|msgpack|ubjson|bjdata|bon8)"
    - "docs/mkdocs/docs/features/binary_formats/"
    - "docs/mkdocs/docs/(api/basic_json|examples)/(to|from)_(bson|cbor|msgpack|ubjson|bjdata|bon8)"

- label: "aspect: binary formats"
  title: "(?i)(bson|cbor|msgpack|messagepack|ubjson|bjdata|bon8|binary format)"

- label: "aspect: json_view"
  files:
    - "include/nlohmann/json_view\\.hpp"
    - "include/nlohmann/detail/view/.*"
    - "single_include/nlohmann/json_view\\.hpp"
    - "tests/src/unit-json_view.*"
    - "tests/src/fuzzer-parse_json_view\\.cpp"
    - "tools/amalgamate/config_json_view\\.json"
    - "docs/mkdocs/docs/features/json_view\\.md"
    - "docs/mkdocs/docs/api/basic_json_(document|view)/.*"
    - "docs/mkdocs/docs/api/(ordered_)?json_(editable_)?(document|view)\\.md"
    - "docs/mkdocs/docs/examples/(basic_json_(document|view)__|(ordered_)?json_(editable_)?(document|view)).*"
    - "tests/benchmarks/src/benchmarks_view\\.cpp"

- label: "aspect: json_view"
  title: "(?i)(json_view|json_document|zero-copy)"

- label: "python"
  files:
    - "\\.py$"
    - "requirements[^/]*\\.txt$"

- label: "S"
  size-below: 10
- label: "M"
  size-above: 9
  size-below: 100
- label: "L"
  size-above: 100
