name: Windows

on:
  push:
    branches: [develop, master, 'release/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
# ────────────────────────────────────────────
# 1) Simple MSVC build (latest image, Release)
# ────────────────────────────────────────────
  msvc-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DJSON_BuildTests=ON

      - name: Build
        run: cmake --build build --config Release --parallel 10

      - name: Test
        run: |
          cd build
          ctest -j 10 -C Release --output-on-failure

# ────────────────────────────────────────────
# 2) Simple MinGW build (latest image)
# ────────────────────────────────────────────
  mingw-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@84c781b557efd538dec66bde06988d81cd3138cf  # v2.2.0
        with:
          version: 13.2.0
          static: 0

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DJSON_BuildTests=ON

      - name: Build
        run: cmake --build build --parallel 10

      - name: Test
        run: |
          cd build
          ctest -j 10 --output-on-failure

# ────────────────────────────────────────────
# 3) Full MSVC matrix (Win-2022, Debug/Release, x86/x64, std versions)
# ────────────────────────────────────────────
  msvc-matrix:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type:   [Debug, Release]
        architecture: [Win32, x64]
        std_version:  [default, latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extra CXX flags
        shell: bash
        run: |
          if [ "${{ matrix.std_version }}" = "latest" ]; then
            echo "FLAGS=/permissive- /std:c++latest /utf-8 /W4 /WX" >> $GITHUB_ENV
          else
            echo "FLAGS=/W4 /WX" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
                -G "Visual Studio 17 2022" `
                -A ${{ matrix.architecture }} `
                -DJSON_BuildTests=ON `
                -DCMAKE_CXX_FLAGS="$env:FLAGS"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 10

      - name: Test
        run: |
          cd build
          ctest -j 10 -C ${{ matrix.build_type }} --output-on-failure

# ────────────────────────────────────────────
# 4) LLVM/Clang matrix (Win-2022)
# ────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────
# Clang/LLVM matrix on Windows-2022 (uses MSVC CRT + Ninja)
# ────────────────────────────────────────────────────────────────
clang:
  runs-on: windows-2022
  strategy:
    matrix:
      llvm: [11, 12, 13, 14, 15]            # versions we still want to test
  steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 pinned

    - name: Install LLVM ${{ matrix.llvm }}
      shell: pwsh
      run: |
        $url   = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.llvm }}.0.0/LLVM-${{ matrix.llvm }}.0.0-win64.exe"
        curl -fsSL -o llvm.exe $url
        7z x llvm.exe -y -o"C:/Program Files/LLVM"

    - name: Add Ninja to PATH
      uses: seanmiddleditch/gha-setup-ninja@v4           # small, cached action

    - name: Configure & build with clang++
      run: |
        cmake -S . -B build `
              -G "Ninja" `
              -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe" `
              -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe" `
              -DJSON_BuildTests=ON
        cmake --build build --parallel 10

    - name: Test
      run: |
        cd build
        ctest -j 10 --exclude-regex "test-unicode" --output-on-failure


# ────────────────────────────────────────────
# 5) Clang-CL matrix (Win-2022, x86 & x64)
# ────────────────────────────────────────────
  clang-cl:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [Win32, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure & build with Clang-CL (${{ matrix.arch }})
        shell: cmd
        run: |
          cmake -S . -B build ^
                -G "Visual Studio 17 2022" ^
                -A ${{ matrix.arch }} ^
                -T ClangCL ^
                -DJSON_BuildTests=ON ^
          && cmake --build build --config Debug --parallel 10

      - name: Test
        shell: cmd
        run: |
          cd build ^
          && ctest -j 10 -C Debug --exclude-regex "test-unicode" --output-on-failure
