name: Windows

on:
  push:
    branches:
      - develop
      - master
      - release/*
  pull_request:
    # labeled: the "🚀 ready to merge" label starts the full set (see below)
    types: [opened, synchronize, reopened, labeled]
    # Skip pull requests that change only files no job here reads. The list is checked by
    # tools/check_path_filters/check_path_filters.py (repository_checks.yml); change both together.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!.github/*'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/external_ci/**'
      - '!.github/workflows/**'
      - '!.reuse/**'
      - '!LICENSES/**'
      - '!CITATION.cff'
      - '!REUSE.toml'
      # read by tools/check_build_options in the ci_meson_install job (ubuntu.yml)
      - 'docs/mkdocs/docs/integration/package_managers.md'
      # built by the swiftpm job (macos.yml)
      - 'docs/mkdocs/docs/integration/swift/**'
      - '.github/workflows/windows.yml'
  schedule:
    # the nightly set (see below), on develop
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run triggered by any other label gets a group of its own, so it does not
# cancel the run of the last push; its jobs are skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != '🚀 ready to merge' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true


# The jobs are split into three sets like in ubuntu.yml (see "How CI runs" in
# docs/mkdocs/docs/community/quality_assurance.md): the PR set runs on every
# push; the full set after the PR set passed, on pushes and on pull requests
# with the "🚀 ready to merge" label; the nightly set nightly on develop, on
# pushes to master and release/*, and when started by hand. tools/ci_jobs
# checks that every job belongs to exactly one set.

jobs:
  ###########################################################################
  # PR set
  ###########################################################################

  mingw:
    if: &pr_set ${{ github.event_name != 'schedule' && (github.event.action != 'labeled' || github.event.label.name == '🚀 ready to merge') }}
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [x86]

    steps: &mingw_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63 # v3.0
        with:
          platform: ${{ matrix.architecture }}
          version: 12.2.0 # https://github.com/egor-tensin/setup-mingw/issues/14
      - name: Run CMake
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug -DJSON_BuildTests=On
      - name: Build
        run: cmake --build build --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C Debug --output-on-failure

  msvc:
    if: *pr_set
    strategy:
      matrix:
        include:
          - build_type: Debug
            architecture: x64
            std_version: default
          - build_type: Release
            architecture: x64
            std_version: default
          - build_type: Debug
            architecture: Win32
            std_version: default
          - build_type: Release
            architecture: Win32
            std_version: latest

    runs-on: windows-2022

    steps: &msvc_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set extra CXX_FLAGS for latest std_version
        id: cxxflags
        run: |
          if [ "${{ matrix.std_version }}" = "latest" ]; then
            echo "flags=/permissive- /std:c++latest /utf-8 /W4 /WX" >> $GITHUB_ENV
          else
            echo "flags=/W4 /WX" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Run CMake (Release)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DJSON_BuildTests=On -DCMAKE_CXX_FLAGS="$env:flags"
        if: matrix.build_type == 'Release'
        shell: pwsh
      - name: Run CMake (Debug)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DJSON_BuildTests=On -DJSON_FastTests=ON -DCMAKE_CXX_FLAGS="$env:flags"
        if: matrix.build_type == 'Debug'
        shell: pwsh
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C ${{ matrix.build_type }} --output-on-failure

  # Visual Studio 2026 (v145 toolset) on the windows-2025 image. The "Visual Studio
  # 18 2026" generator requires CMake 4.2+, so a recent CMake is fetched explicitly.
  msvc-vs2026:
    if: *pr_set
    strategy:
      matrix:
        include:
          - build_type: Debug
            architecture: x64
            std_version: latest
          - build_type: Release
            architecture: Win32
            std_version: default

    runs-on: windows-2025

    steps: &msvc_vs2026_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
      - name: Set extra CXX_FLAGS for latest std_version
        # /wd5285 silences C5285 emitted by the bundled third-party doctest.h, which
        # specializes std::tuple (newly diagnosed by the VS2026 v145 toolset)
        run: |
          if [ "${{ matrix.std_version }}" = "latest" ]; then
            echo "flags=/permissive- /std:c++latest /utf-8 /W4 /WX /wd5285" >> $GITHUB_ENV
          else
            echo "flags=/W4 /WX /wd5285" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Run CMake (Release)
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.architecture }} -DJSON_BuildTests=On -DCMAKE_CXX_FLAGS="$env:flags"
        if: matrix.build_type == 'Release'
        shell: pwsh
      - name: Run CMake (Debug)
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.architecture }} -DJSON_BuildTests=On -DJSON_FastTests=ON -DCMAKE_CXX_FLAGS="$env:flags"
        if: matrix.build_type == 'Debug'
        shell: pwsh
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C ${{ matrix.build_type }} --output-on-failure

  # Native ARM64 Windows runner with the MSVC ARM64 toolset. The windows-11-arm
  # label is only available for public repositories.
  msvc-arm64:
    if: *pr_set
    strategy:
      matrix:
        build_type: [Debug]

    runs-on: windows-11-arm

    steps: &msvc_arm64_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run CMake (Release)
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ARM64 -DJSON_BuildTests=On -DCMAKE_CXX_FLAGS="/W4 /WX"
        if: matrix.build_type == 'Release'
        shell: pwsh
      - name: Run CMake (Debug)
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ARM64 -DJSON_BuildTests=On -DJSON_FastTests=ON -DCMAKE_CXX_FLAGS="/W4 /WX"
        if: matrix.build_type == 'Debug'
        shell: pwsh
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C ${{ matrix.build_type }} --output-on-failure

  clang:
    if: *pr_set
    runs-on: windows-2022
    strategy:
      matrix:
        version: [20.1.8]

    steps: &clang_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang
        run: curl -fsSL -o LLVM${{ matrix.version }}.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.version }}/LLVM-${{ matrix.version }}-win64.exe ; 7z x LLVM${{ matrix.version }}.exe -y -o"C:/Program Files/LLVM"
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63 # v3.0
        with:
          platform: x64
          version: 12.2.0 # https://github.com/egor-tensin/setup-mingw/issues/14
      # CMAKE_CXX_FLAGS_DEBUG is overridden to drop the default -g: linking
      # test-regression2_cpp20 intermittently fails with "relocation truncated
      # to fit: IMAGE_REL_AMD64_SECREL against `.debug_line'" because the
      # MinGW linker cannot relocate the debug sections this test produces.
      # The tests are only built and run here, so the debug info is not used.
      # Do not add -O1 here to shrink the objects further: it does make them
      # link, but the binaries clang 11.0.1 and clang 18.1.8 then produce crash
      # before doctest prints its first line - 39 of 102 tests on clang 18.
      # Keep the objects small by splitting the test files instead.
      # The tests link with LLD: GNU ld fails on objects with more than 32767
      # sections with "relocation truncated to fit: IMAGE_REL_AMD64_REL32
      # against `.rdata'", as it stores the section an associative COMDAT
      # section belongs to in 16 bits (x_associated in binutils'
      # include/coff/internal.h) and so discards the jump tables of inline
      # functions together with the wrong function. Each basic_json
      # specialization and input type a test file instantiates adds many
      # sections, so unit-msgpack.cpp and unit-regression2.cpp kept crossing
      # that limit as the library grew.
      - name: Run CMake
        run: cmake -S . -B build ^
             -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe" ^
             -DCMAKE_CXX_FLAGS="--target=x86_64-w64-mingw32 -stdlib=libstdc++ -pthread" ^
             -DCMAKE_CXX_FLAGS_DEBUG="-g0" ^
             -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -lwinpthread" ^
             -G"MinGW Makefiles" ^
             -DCMAKE_BUILD_TYPE=Debug ^
             -DJSON_BuildTests=On
      - name: Build
        run: cmake --build build --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C Debug --output-on-failure

  ci_module_cpp20:
    if: *pr_set
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The module test uses `import std;`, which needs CMake's experimental
      # import-std support. Its opt-in token is CMake-version-specific, so pin
      # CMake to the version whose token is set in tests/module_cpp20/CMakeLists.txt.
      - name: Get pinned CMake and ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: 4.3.4
      # CMAKE_CXX_FLAGS replaces CMake's MSVC defaults (which include /EHsc), and
      # ci_module_cpp20 forwards it to the module build, so list /EHsc explicitly
      - name: Run CMake (Debug)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DJSON_CI=ON -DCMAKE_CXX_FLAGS="/permissive- /std:c++latest /utf-8 /EHsc /W4 /WX"
      - name: Build
        run: cmake --build build --config Debug --target ci_module_cpp20
        


  ###########################################################################
  # full set: starts after the PR set passed
  ###########################################################################

  msvc_full:
    needs: &pr_set_jobs [mingw, msvc, msvc-vs2026, msvc-arm64, clang, ci_module_cpp20]
    if: &full_set ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, '🚀 ready to merge') }}
    strategy:
      matrix:
        build_type: [Debug, Release]
        architecture: [Win32, x64]
        std_version: [default, latest]
        exclude:
          # in the PR set
          - build_type: Debug
            architecture: x64
            std_version: default
          - build_type: Release
            architecture: x64
            std_version: default
          - build_type: Debug
            architecture: Win32
            std_version: default
          - build_type: Release
            architecture: Win32
            std_version: latest

    runs-on: windows-2022

    steps: *msvc_steps

  # Visual Studio 2026 (v145 toolset) on the windows-2025 image. The "Visual Studio
  # 18 2026" generator requires CMake 4.2+, so a recent CMake is fetched explicitly.
  msvc-vs2026_full:
    needs: *pr_set_jobs
    if: *full_set
    strategy:
      matrix:
        build_type: [Debug, Release]
        architecture: [Win32, x64]
        std_version: [default, latest]
        exclude:
          # in the PR set
          - build_type: Debug
            architecture: x64
            std_version: latest
          - build_type: Release
            architecture: Win32
            std_version: default

    runs-on: windows-2025

    steps: *msvc_vs2026_steps

  # Native ARM64 Windows runner with the MSVC ARM64 toolset. The windows-11-arm
  # label is only available for public repositories.
  msvc-arm64_full:
    needs: *pr_set_jobs
    if: *full_set
    strategy:
      matrix:
        build_type: [Release]

    runs-on: windows-11-arm

    steps: *msvc_arm64_steps

  clang_full:
    needs: *pr_set_jobs
    if: *full_set
    runs-on: windows-2022
    strategy:
      matrix:
        version: [11.0.1, 12.0.1, 13.0.1, 14.0.6, 15.0.7, 16.0.6, 18.1.8, 19.1.7]

    steps: *clang_steps

  clang-cl_full:
    needs: *pr_set_jobs
    if: *full_set
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [Win32, x64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -T ClangCL -DJSON_BuildTests=On
      - name: Build
        run: cmake --build build --config Debug --parallel 10
      - name: Test
        run: cd build ; ctest -j 10 -C Debug --output-on-failure


  ###########################################################################
  # nightly set
  ###########################################################################

  mingw_nightly:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/develop') }}
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [x64]

    steps: *mingw_steps

  # A failure of a scheduled run opens an issue, or comments on the open one.
  nightly_report:
    needs: [mingw_nightly]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
        run: |
          title="Nightly CI failure (${WORKFLOW})"
          body="The nightly run of ${WORKFLOW} on ${SHA:0:10} failed: ${RUN_URL}"
          number=$(gh issue list --state open --search "in:title \"${title}\"" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
